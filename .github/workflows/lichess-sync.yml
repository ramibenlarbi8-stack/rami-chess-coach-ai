name: Lichess game sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lichess-game-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public Lichess games and update incremental stats
        run: python scripts/sync_lichess.py
        env:
          LICHESS_USERNAME: rami9191
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/new_games.pgn data/new_games_stats.json data/sync_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync new Lichess games"
            git push
          else
            echo "No changes to commit"
          fi
